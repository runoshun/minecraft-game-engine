name: build

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Run compiler tests
        run: npm test

      - name: Compile representative datapack
        run: |
          npm run compile:portable -- \
            --source examples/portable-breakout-core/datapack/data/portable_breakout/mcgame/main.ts \
            --namespace ci_portable_breakout \
            --output build/ci/portable_breakout
          test -f build/ci/portable_breakout/.mcgame-portable-generated
          test -f build/ci/portable_breakout/data/ci_portable_breakout/function/portable/tick.mcfunction
