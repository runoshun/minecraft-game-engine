plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    compileOnly "org.graalvm.polyglot:polyglot:${project.graal_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"

    // Loom dev runs execute exploded classes rather than the Jar-in-Jar artifact, so mirror
    // the embedded Graal dependencies onto the dev runtime classpath. These are not packed
    // twice into the production JAR; the include declarations below remain authoritative.
    runtimeOnly "org.graalvm.js:js-language:${project.graal_version}"
    runtimeOnly "org.graalvm.regex:regex:${project.graal_version}"
    runtimeOnly "org.graalvm.truffle:truffle-api:${project.graal_version}"
    runtimeOnly "org.graalvm.truffle:truffle-runtime:${project.graal_version}"
    runtimeOnly "org.graalvm.truffle:truffle-compiler:${project.graal_version}"
    runtimeOnly "org.graalvm.polyglot:polyglot:${project.graal_version}"
    runtimeOnly "org.graalvm.sdk:collections:${project.graal_version}"
    runtimeOnly "org.graalvm.sdk:jniutils:${project.graal_version}"
    runtimeOnly "org.graalvm.sdk:nativeimage:${project.graal_version}"
    runtimeOnly "org.graalvm.sdk:word:${project.graal_version}"
    runtimeOnly "org.graalvm.shadowed:icu4j:${project.graal_version}"
    runtimeOnly "org.graalvm.shadowed:xz:${project.graal_version}"

    include "org.graalvm.js:js-language:${project.graal_version}"
    include "org.graalvm.regex:regex:${project.graal_version}"
    include "org.graalvm.truffle:truffle-api:${project.graal_version}"
    include "org.graalvm.truffle:truffle-runtime:${project.graal_version}"
    include "org.graalvm.truffle:truffle-compiler:${project.graal_version}"
    include "org.graalvm.polyglot:polyglot:${project.graal_version}"
    include "org.graalvm.sdk:collections:${project.graal_version}"
    include "org.graalvm.sdk:jniutils:${project.graal_version}"
    include "org.graalvm.sdk:nativeimage:${project.graal_version}"
    include "org.graalvm.sdk:word:${project.graal_version}"
    include "org.graalvm.shadowed:icu4j:${project.graal_version}"
    include "org.graalvm.shadowed:xz:${project.graal_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    maxHeapSize = '256m'
    maxParallelForks = 1
}

tasks.register('compilePortable', JavaExec) {
    group = 'mcgame'
    description = 'Compile portable IR/portableDsl from a TypeScript main.ts into a vanilla datapack.'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.mcgame.runtime.PortableCompilerCli'
    doFirst {
        def source = providers.gradleProperty('portableSource').orNull
        def namespace = providers.gradleProperty('portableNamespace').orNull
        def output = providers.gradleProperty('portableOutput').orNull
        if (!source || !namespace || !output) {
            throw new GradleException('compilePortable requires -PportableSource=... -PportableNamespace=... -PportableOutput=...')
        }
        args '--source', file(source).absolutePath, '--namespace', namespace, '--output', file(output).absolutePath
    }
}
